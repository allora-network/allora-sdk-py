# Reputer deployment with sidecar services for ground truth and loss computation.
#
# This mirrors how allora-offchain-node works: the ground truth provider
# and loss function are separate HTTP services that the worker calls.
#
# Sidecar options:
#   1. ground_truth_ref  - Python callable that calls ground-truth-api
#   2. loss_function.mode: external_service - hits loss-function-api
#
# Usage:
#   docker compose -f docker-compose.reputer.yaml up -d
services:
  # Ground truth provider (e.g. fetches real price data or actual outcomes).
  ground-truth-api:
    image: your-ground-truth-provider:latest   # replace with your image
    container_name: ground_truth_provider
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # External loss function service (e.g. allora-standard-loss-functions).
  # Only needed if loss_function.mode is "external_service" in config.
  loss-function-api:
    image: alloranetwork/allora-standard-loss-functions:latest
    container_name: loss_function_service
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  allora-worker:
    build: .
    image: allora-sdk-worker:latest
    command: ["run", "--config", "/app/worker_config.yaml"]
    volumes:
      - ./worker_config.yaml:/app/worker_config.yaml:ro
      - ./secrets/allora_mnemonic:/run/secrets/allora_mnemonic:ro
    environment:
      - PYTHONUNBUFFERED=1
      - GROUND_TRUTH_API_URL=http://ground-truth-api:8001
      - LOSS_FUNCTION_API_URL=http://loss-function-api:8002
    depends_on:
      ground-truth-api:
        condition: service_healthy
      loss-function-api:
        condition: service_healthy
    restart: unless-stopped
