wallet:
  mnemonic_file: /run/secrets/allora_mnemonic
  prefix: allo

network:
  chain_id: allora-testnet-1
  url: grpc+https://allora-grpc.testnet.allora.network:443
  websocket_url: wss://allora-rpc.testnet.allora.network/websocket
  fee_denom: uallo
  fee_minimum_gas_price: 10

workers:
  # Inferer: calls a Python function to produce inferences.
  - role: inferer
    topic_id: 22
    fee_tier: standard
    polling_interval: 120
    run_ref: app.inference.eth_model:predict

  # Forecaster: calls a Python function to produce forecasts.
  - role: forecaster
    topic_id: 22
    fee_tier: standard
    polling_interval: 30
    run_ref: app.forecasts.eth_forecaster:run

  # Reputer (internal loss): SDK auto-selects the loss method from on-chain config.
  - role: reputer
    topic_id: 22
    fee_tier: standard
    polling_interval: 30
    ground_truth_ref: app.gt.eth_ground_truth:get_value
    min_stake_uallo: 100000000
    loss_function:
      mode: internal_auto

  # Reputer (external loss): delegates loss computation to a sidecar HTTP service
  # (e.g. allora-standard-loss-functions or a custom container).
  - role: reputer
    topic_id: 23
    fee_tier: priority
    polling_interval: 30
    ground_truth_ref: app.gt.eth_ground_truth:get_value
    min_stake_uallo: 100000000
    loss_function:
      mode: external_service
      endpoint: http://loss-function-api:8002/loss
      method: POST
      timeout_seconds: 5
      payload_template:
        topic_id: "{topic_id}"
        ground_truth: "{ground_truth}"
        predicted: "{predicted}"
