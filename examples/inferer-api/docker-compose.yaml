# Inferer — worker + model sidecar container.
#
# The model container exposes an HTTP API. The worker calls it to get
# inferences — no Python wrapper code needed.
#
# Replace "your-inference-model:latest" with your actual model image.
#
# Before running, create your wallet secret:
#   mkdir -p secrets
#   echo "your twelve word mnemonic phrase here" > secrets/allora_mnemonic
#   chmod 600 secrets/allora_mnemonic
#
# Then:
#   docker compose up -d
#   docker compose logs -f allora-worker
services:
  model-api:
    image: your-inference-model:latest
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  allora-worker:
    build: ../..
    image: allora-sdk-worker:latest
    command: ["run", "--config", "/app/worker_config.yaml"]
    volumes:
      - ./worker_config.yaml:/app/worker_config.yaml:ro
      - ./secrets/allora_mnemonic:/run/secrets/allora_mnemonic:ro
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      model-api:
        condition: service_healthy
    restart: unless-stopped
