# Reputer — worker + ground truth sidecar + external loss function sidecar.
#
# This mirrors the allora-offchain-node pattern: ground truth and loss
# computation run as separate HTTP services.
#
# Replace "your-ground-truth-provider:latest" with your actual image.
#
# Before running, create your wallet secret:
#   mkdir -p secrets
#   echo "your twelve word mnemonic phrase here" > secrets/allora_mnemonic
#   chmod 600 secrets/allora_mnemonic
#
# Then:
#   docker compose up -d
#   docker compose logs -f allora-worker
services:
  ground-truth-api:
    image: your-ground-truth-provider:latest
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  loss-function-api:
    image: alloranetwork/allora-standard-loss-functions:latest
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  allora-worker:
    build: ../..
    image: allora-sdk-worker:latest
    command: ["run", "--config", "/app/worker_config.yaml"]
    volumes:
      - ./worker_config.yaml:/app/worker_config.yaml:ro
      - ./secrets/allora_mnemonic:/run/secrets/allora_mnemonic:ro
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      ground-truth-api:
        condition: service_healthy
      loss-function-api:
        condition: service_healthy
    restart: unless-stopped
